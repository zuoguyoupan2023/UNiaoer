name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # A3：manifest 结构/署名/媒体归属校验（不联网抽查，避免 CI 抖动）
      - name: Check bank consistency
        run: node scripts/check-bank.mjs --no-net

      # 015 i18n-5：CJK 字面量门禁 + zh-CN/en key 对齐校验
      - name: i18n scan (unwrapped CJK literals)
        run: npm run i18n:scan

      - name: i18n check (zh-CN/en key parity)
        run: npm run i18n:check

  # H2 E2E：关键路径回归（独立 job，不拖慢主 verify）
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --only-shell chromium

      - name: Run E2E
        run: npx playwright test

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
