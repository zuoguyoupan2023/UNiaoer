<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 品牌鸟图标（lucide Bird），与顶栏一致；R29 -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- 环境鸟鸣首发音（R30）：**这里不放 <link preload>** ——
         · `as="audio"`：Chromium 不支持该 as 值（只认 image/script/style/track/font/fetch），整条预取被忽略；
         · `as="fetch"`：能预取，但该文件要等用户开启环境音才「用」，Chromium 会报
           「preloaded but not used within a few seconds」；
         · `rel="prefetch"`：不报 unused，但实测会多一次请求（prefetch 一份 + JS 预热一份）。
         → 真正的预热由应用启动时完成：`src/App.vue` 会 `ambiencePlayer.start({ muted: true })`（R38 静音待命），
           其中 `prewarmBirdTracks()` 用 `fetch(url, { priority: 'low' })` 预取全部音轨（含首发音）。
           实测去掉本条 link 后：owl.mp3 仍被预取 1 次、控制台 0 警告。详见 docs/033（CORS 模式）。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 050 O1：权威名录层（manifest-meta.json，10,844 种 × 全字段、不含媒体，约 3.8MB）
         提前发起请求，省掉「HTML 下载 → JS 解析 → fetch」的一个完整 RTT（移动端 100–400ms）。
         · as="fetch" 必须配 crossorigin，否则浏览器会用第二个 key 再请求一次；
         · 不阻塞渲染：只是提前发起、结果进内存；
         · 失败可降级：loadMeta() 的三级回退链不受影响。 -->
    <link rel="preload" as="fetch" type="application/json" href="/data/manifest-meta.json" crossorigin="anonymous" />
    <meta
      name="description"
      content="UNiaoer · 鸟语识别：观鸟学习与鸟类识别练习（看图认鸟 / 听音认鸟）"
    />
    <!-- SEO：UNiaoer 的多重谐音/别名放在 meta，不进标签页标题（R42） -->
    <meta
      name="keywords"
      content="UNiaoer,有鸟儿,幼鸟儿,友鸟儿,你个鸟人,鸟语识别,观鸟,鸟类识别,认鸟,看图认鸟,听音认鸟"
    />
    <!-- 索引策略：公开页可索引（私有路由在 robots.txt 里 Disallow） -->
    <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1" />
    <title>UNiaoer</title>
    <!-- R35：正式域名 uniaoer.com（已绑定 Pages） -->
    <link rel="canonical" href="https://uniaoer.com/" />

    <!-- Open Graph（社交/IM 预览） -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="UNiaoer" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:url" content="https://uniaoer.com/" />
    <meta property="og:title" content="UNiaoer · 鸟语识别" />
    <meta
      property="og:description"
      content="用真实鸟类照片与鸟鸣，做看图认鸟 / 听音认鸟练习"
    />
    <meta property="og:image" content="https://uniaoer.com/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="UNiaoer — 用真实鸟类照片与鸟鸣做识别练习" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="UNiaoer · 鸟语识别" />
    <meta
      name="twitter:description"
      content="用真实鸟类照片与鸟鸣，做看图认鸟 / 听音认鸟练习"
    />
    <meta name="twitter:image" content="https://uniaoer.com/og-cover.png" />

    <!-- GEO（面向生成式引擎）：结构化数据，便于搜索/LLM 直接引用事实 -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://uniaoer.com/#website",
            "url": "https://uniaoer.com/",
            "name": "UNiaoer",
            "alternateName": ["有鸟儿", "幼鸟儿", "友鸟儿", "鸟语识别"],
            "description": "用真实鸟类照片与鸟鸣做看图认鸟 / 听音认鸟练习，并提供全球鸟类名录、分布与观鸟点浏览。",
            "inLanguage": ["zh-CN", "en"],
            "publisher": { "@id": "https://uniaoer.com/#org" }
          },
          {
            "@type": "Organization",
            "@id": "https://uniaoer.com/#org",
            "name": "UNiaoer",
            "url": "https://uniaoer.com/",
            "logo": "https://uniaoer.com/favicon.svg"
          },
          {
            "@type": "WebApplication",
            "@id": "https://uniaoer.com/#app",
            "name": "UNiaoer",
            "url": "https://uniaoer.com/",
            "applicationCategory": "EducationalApplication",
            "operatingSystem": "Any",
            "browserRequirements": "需要 JavaScript；推荐现代浏览器",
            "isAccessibleForFree": true,
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "CNY" },
            "description": "免费、开源的鸟类识别练习：看图认鸟 / 听音认鸟，5 个难度档位，11,026 种可玩物种，媒体逐条 CC 署名。",
            "featureList": [
              "看图认鸟（真实鸟类照片）",

              "全球鸟类名录（11,026 种）",

            ]
          }
        ]
      }
    </script>
  </head>

    <div id="app"></div>
    <!-- 无 JS / 爬虫兜底：给搜索与 LLM 一段可引用的事实摘要 -->

      <p>本站需要启用 JavaScript 才能做题。</p>

    <script type="module" src="/src/main.ts"></script>

</html>
